[versions]
kotlin = "2.0.21"
agp = "8.7.2"
coroutines = "1.9.0"
serialization = "1.7.3"
junit5 = "5.11.3"
turbine = "1.2.0"
robolectric = "4.14"
mockk = "1.13.13"
androidxCore = "1.13.1"
androidxTestExt = "1.2.1"
androidxTestCore = "1.6.1"
ktlintPlugin = "12.1.1"
detektPlugin = "1.23.7"
room = "2.7.2"
androidxSqlite = "2.5.2"
ksp = "2.0.21-1.0.28"
sherpaOnnx = "1.13.7"
# P13: Compose foundation (D15). The compiler plugin is pinned to the exact Kotlin version above
# (buildSrc/build.gradle.kts), so it has no version entry of its own here.
composeBom = "2024.09.03"
activityCompose = "1.9.3"
# WP0' (Wave F scaffolding, D36/FR-AST-3a): newest published at fetch time, read from
# https://dl.google.com/dl/android/maven2/com/google/mediapipe/group-index.xml (tasks-genai's
# versions attribute) on 2026-09-10. Consumed only by :llm-mediapipe.
mediapipeTasksGenai = "0.10.35"
# WPB (P19/P20 Wave F): the newest 3.x tag at https://github.com/mik3y/usb-serial-for-android
# releases on 2026-09-10 is v3.11.0 (2026-07-18), but its AAR metadata declares
# minCompileSdk = 35 (its own androidx.annotation bump), and this project's shared
# ort.android-library convention plugin — outside :rig-usb/:rig-bluetooth's ownership for this
# work package — pins compileSdk 34. v3.10.0 (2025-12-05) is the newest tag that still declares
# no compileSdk floor above 34; confirmed against its published AAR metadata. Revisit once
# compileSdk moves to >= 35 (a WP0'-owned change). Consumed only by :rig-usb.
usbSerialForAndroid = "3.10.0"
# WPH follow-up (P21, FR-DIG-5): the newest *stable* (non-`-rc`/`-alpha`/`-beta`) version at
# https://dl.google.com/dl/android/maven2/androidx/work/work-runtime-ktx/maven-metadata.xml,
# fetched 2026-09-10, is 2.11.2 (`maven-metadata.xml`'s own `latest` field names 2.12.0-rc01, a
# release candidate skipped for exactly that reason) — but 2.10.0 and later's AAR metadata
# declares minCompileSdk = 35 (confirmed directly: `:pipeline:checkDebugUnitTestAarMetadata`
# failed naming exactly that requirement against 2.11.2), and this project's shared
# ort.android-library convention plugin — outside this follow-up's ownership — pins
# compileSdk 34, the same shape WPB's usbSerialForAndroid pin above already documents. 2.9.1 is
# the newest release that still declares no compileSdk floor above 34; confirmed by
# `:pipeline:checkDebugUnitTestAarMetadata` passing with it. Revisit once compileSdk moves to
# >= 35. Consumed by :pipeline for ProseDigestRunner's charging+idle-constrained schedule.
androidxWork = "2.9.1"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit5" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version = "1.11.3" }
junit-vintage-engine = { module = "org.junit.vintage:junit-vintage-engine", version.ref = "junit5" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExt" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
room-testing = { module = "androidx.room:room-testing", version.ref = "room" }
androidx-sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "androidxSqlite" }
# AGP's unit-test runtime classpath resolves the Android-variant artifact even though the test
# actually runs on the host JVM (Robolectric) — see data/build.gradle.kts's testImplementation.
androidx-sqlite-bundled-jvm = { module = "androidx.sqlite:sqlite-bundled-jvm", version.ref = "androidxSqlite" }
sherpa-onnx-jvm = { module = "com.github.k2-fsa.sherpa-onnx:sherpa-onnx-jvm", version.ref = "sherpaOnnx" }
sherpa-onnx-native-win-x64 = { module = "com.github.k2-fsa.sherpa-onnx:sherpa-onnx-native-lib-win-x64", version.ref = "sherpaOnnx" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
mediapipe-tasks-genai = { module = "com.google.mediapipe:tasks-genai", version.ref = "mediapipeTasksGenai" }
usb-serial-android = { module = "com.github.mik3y:usb-serial-for-android", version.ref = "usbSerialForAndroid" }
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "androidxWork" }
androidx-work-testing = { module = "androidx.work:work-testing", version.ref = "androidxWork" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-application = { id = "com.android.application", version.ref = "agp" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
