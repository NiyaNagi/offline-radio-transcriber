# The legacy shadow SQLite (sqlite4java) has no FTS5 module; NATIVE mode links the real
# Android SQLite amalgamation instead — needed by MigrationTestHelper's raw pre-migration
# fixtures (MigrationTest, FtsIndexRepairTest), which still go through Robolectric's classic
# framework SQLite shadow, not OrtDatabase's own driver.
#
# Register R-204: this project's actual FTS5 table (`transcript_fts`) no longer depends on
# either SQLite build having fts5 — empirically, *neither* did, this project's Robolectric host
# included (contrary to what this comment used to claim). `OrtDatabase.create` installs
# `BundledSQLiteDriver` (`androidx.sqlite:sqlite-bundled`), which bypasses both and ships its
# own SQLite built with fts5.
sqliteMode=NATIVE
