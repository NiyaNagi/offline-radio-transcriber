<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;450;500;600&display=swap">
  <style>
    body { margin: 0; font-family: 'IBM Plex Sans', system-ui, sans-serif; }
    a { color: oklch(0.72 0.14 150); } a:hover { color: oklch(0.80 0.14 150); }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: oklch(0.11 0.006 250); position: relative; overflow: hidden;">

  <!-- dimmed page behind -->
  <div style="position: absolute; inset: 0; padding-top: 44px; opacity: 0.22;">
    <div style="padding: 30px 20px 0; color: oklch(0.94 0.006 250);">
      <div style="font-size: 27px; font-weight: 600; letter-spacing: -0.022em;">Overnight</div>
      <div style="font-size: 13.5px; color: oklch(0.62 0.008 250); margin-top: 3px;">412 overs · 19 stations</div>
    </div>
  </div>

  <!-- drawer -->
  <div style="position: absolute; top: 0; bottom: 0; left: 0; width: 306px; background: oklch(0.185 0.009 250); padding-top: 44px; box-sizing: border-box; display: flex; flex-direction: column; border-right: 1px solid oklch(0.28 0.010 250);">

    <div style="padding: 18px 20px 16px;">
      <div style="font-size: 16px; font-weight: 600; letter-spacing: -0.01em; color: oklch(0.94 0.006 250);">Repeater watch</div>
      <div style="font-size: 12.5px; color: oklch(0.60 0.008 250); margin-top: 3px;">TH-D75A · both bands</div>
    </div>

    <div style="height: 1px; background: oklch(0.26 0.010 250); margin: 0 20px;"></div>

    <div style="flex-grow: 1; padding: 12px 12px 0;">

      <div style="display: flex; align-items: center; gap: 13px; padding: 10px 12px; border-radius: 8px; background: oklch(0.26 0.012 250);">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="oklch(0.72 0.14 150)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l9-8 9 8"></path><path d="M6 10v9h12v-9"></path></svg>
        <div style="font-size: 14.5px; font-weight: 500; color: oklch(0.96 0.006 250); flex-grow: 1;">Now</div>
      </div>

      <div style="display: flex; align-items: center; gap: 13px; padding: 10px 12px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="oklch(0.68 0.008 250)" stroke-width="1.9" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
        <div style="font-size: 14.5px; color: oklch(0.86 0.006 250); flex-grow: 1;">Log</div>
        <div style="font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; color: oklch(0.55 0.008 250);">412</div>
      </div>

      <div style="display: flex; align-items: center; gap: 13px; padding: 10px 12px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="oklch(0.68 0.008 250)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"></rect><path d="M8 10h8M8 14h5"></path></svg>
        <div style="font-size: 14.5px; color: oklch(0.86 0.006 250); flex-grow: 1;">Threads</div>
        <div style="font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; color: oklch(0.55 0.008 250);">31</div>
      </div>

      <div style="display: flex; align-items: center; gap: 13px; padding: 10px 12px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="oklch(0.68 0.008 250)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"></circle><path d="M5.5 19c0-3.3 2.9-5.5 6.5-5.5s6.5 2.2 6.5 5.5"></path></svg>
        <div style="font-size: 14.5px; color: oklch(0.86 0.006 250); flex-grow: 1;">Stations</div>
        <div style="font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; color: oklch(0.55 0.008 250);">19</div>
      </div>

      <div style="display: flex; align-items: center; gap: 13px; padding: 10px 12px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="oklch(0.68 0.008 250)" stroke-width="1.9" stroke-linecap="round"><path d="M12 4v16M7 8v8M17 8v8M3 11v2M21 11v2"></path></svg>
        <div style="font-size: 14.5px; color: oklch(0.86 0.006 250); flex-grow: 1;">Frequencies</div>
        <div style="font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; color: oklch(0.55 0.008 250);">2</div>
      </div>

      <div style="display: flex; align-items: center; gap: 13px; padding: 10px 12px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="oklch(0.68 0.008 250)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2.5"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>
        <div style="font-size: 14.5px; color: oklch(0.86 0.006 250); flex-grow: 1;">Earlier nights</div>
      </div>

      <div style="height: 1px; background: oklch(0.26 0.010 250); margin: 12px 12px;"></div>

      <div style="display: flex; align-items: center; gap: 13px; padding: 10px 12px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="oklch(0.68 0.008 250)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v4M12 17v4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M3 12h4M17 12h4M5.6 18.4l2.8-2.8M15.6 8.4l2.8-2.8"></path></svg>
        <div style="font-size: 14.5px; color: oklch(0.86 0.006 250); flex-grow: 1;">Capture</div>
        <div style="display: flex; align-items: center; gap: 5px;">
          <div style="width: 6px; height: 6px; border-radius: 50%; background: oklch(0.72 0.14 150);"></div>
          <div style="font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; color: oklch(0.68 0.10 150);">6:42</div>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 13px; padding: 10px 12px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="oklch(0.68 0.008 250)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.6-5.9"></path><path d="M20 4v4h-4"></path></svg>
        <div style="font-size: 14.5px; color: oklch(0.86 0.006 250); flex-grow: 1;">Improve records</div>
        <div style="font-size: 10.5px; font-weight: 600; color: oklch(0.16 0.01 75); background: oklch(0.78 0.13 75); padding: 1px 6px; border-radius: 9px;">64</div>
      </div>

      <div style="display: flex; align-items: center; gap: 13px; padding: 10px 12px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="oklch(0.68 0.008 250)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 7 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0-1.1-2.7H1a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 2.6 7"></path></svg>
        <div style="font-size: 14.5px; color: oklch(0.86 0.006 250); flex-grow: 1;">Settings</div>
      </div>

    </div>

    <!-- storage footer -->
    <div style="padding: 14px 20px 20px; border-top: 1px solid oklch(0.26 0.010 250);">
      <div style="display: flex; align-items: baseline; margin-bottom: 7px;">
        <div style="font-size: 12px; color: oklch(0.62 0.008 250); flex-grow: 1;">Audio 38.2 GB</div>
        <div style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: oklch(0.55 0.008 250);">of 60</div>
      </div>
      <div style="height: 4px; background: oklch(0.26 0.010 250); border-radius: 2px; overflow: hidden;">
        <div style="width: 64%; height: 100%; background: oklch(0.60 0.10 150);"></div>
      </div>
    </div>

  </div>

</div>
</x-dc>
</body>
</html>
