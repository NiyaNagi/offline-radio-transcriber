<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;450;500;600&display=swap">
  <style>
    body { margin: 0; font-family: 'IBM Plex Sans', system-ui, sans-serif; }
    a { color: oklch(0.72 0.14 150); } a:hover { color: oklch(0.80 0.14 150); }
    .lbl { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: oklch(0.58 0.008 250); }
    .opt { display: flex; align-items: center; gap: 11px; min-height: 44px; border-top: 1px solid oklch(0.21 0.010 250); }
    .chk { width: 16px; height: 16px; border-radius: 4px; box-sizing: border-box; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
    .on { background: oklch(0.72 0.14 150); }
    .off { border: 1.5px solid oklch(0.40 0.008 250); }
    .cnt { font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; color: oklch(0.55 0.008 250); }
    .chip { font-size: 12px; padding: 5px 11px; border-radius: 14px; border: 1px solid oklch(0.30 0.010 250); color: oklch(0.66 0.008 250); }
    .chip-on { font-size: 12px; font-weight: 500; padding: 5px 11px; border-radius: 14px; background: oklch(0.30 0.012 250); color: oklch(0.94 0.006 250); }
    .fld { flex-grow: 1; display: flex; align-items: center; height: 44px; padding: 0 13px; background: oklch(0.155 0.008 250); border: 1px solid oklch(0.28 0.010 250); border-radius: 8px; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: oklch(0.155 0.008 250); color: oklch(0.94 0.006 250); display: flex; flex-direction: column; overflow: hidden; padding-top: 44px; box-sizing: border-box;">

  <div style="display: flex; align-items: center; gap: 12px; padding: 10px 16px 0;">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="oklch(0.72 0.14 150)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
    <div style="font-size: 19px; font-weight: 600; letter-spacing: -0.01em; flex-grow: 1;">Filters</div>
    <div style="display: flex; align-items: center; min-height: 44px;"><div style="font-size: 13px; color: oklch(0.72 0.14 150);">Clear all</div></div>
  </div>

  <div style="flex-grow: 1; overflow: hidden; padding: 6px 20px 0;">

    <div class="lbl" style="padding-top: 10px;">Callsign</div>
    <div style="display: flex; gap: 10px; padding: 8px 0 4px;">
      <div class="fld"><div style="font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: oklch(0.94 0.006 250);">K7L</div><div style="flex-grow: 1;"></div><div style="font-size: 11px; color: oklch(0.52 0.008 250);">prefix match</div></div>
    </div>

    <div class="lbl" style="padding-top: 14px;">Frequency and band</div>
    <div style="display: flex; gap: 7px; padding: 8px 0 4px; flex-wrap: wrap;">
      <div class="chip-on">All</div>
      <div class="chip" style="font-family: 'IBM Plex Mono', monospace;">145.230</div>
      <div class="chip" style="font-family: 'IBM Plex Mono', monospace;">146.960</div>
      <div class="chip">2 m</div>
      <div class="chip">70 cm</div>
    </div>

    <div class="lbl" style="padding-top: 14px;">Time</div>
    <div style="display: flex; gap: 7px; padding: 8px 0 8px;">
      <div class="chip">Tonight</div>
      <div class="chip">Last 7 nights</div>
      <div class="chip-on">Range</div>
      <div class="chip">All</div>
    </div>
    <div style="display: flex; gap: 10px; padding-bottom: 4px;">
      <div class="fld"><div style="font-size: 11px; color: oklch(0.52 0.008 250); width: 34px;">from</div><div style="font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: oklch(0.94 0.006 250);">1 Sep 18:00</div></div>
      <div class="fld"><div style="font-size: 11px; color: oklch(0.52 0.008 250); width: 34px;">to</div><div style="font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: oklch(0.94 0.006 250);">8 Sep 07:00</div></div>
    </div>

    <div class="lbl" style="padding-top: 14px;">Attribution</div>
    <div style="display: flex; flex-direction: column; padding-top: 6px;">
      <div class="opt">
        <div class="chk on"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="oklch(0.16 0.01 150)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg></div>
        <div style="width: 9px; height: 9px; border-radius: 50%; background: oklch(0.72 0.14 150);"></div>
        <div style="font-size: 14px; color: oklch(0.94 0.006 250); flex-grow: 1;">Confirmed</div>
        <div class="cnt">1,904</div>
      </div>
      <div class="opt">
        <div class="chk on"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="oklch(0.16 0.01 150)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg></div>
        <div style="width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid oklch(0.72 0.14 150); box-sizing: border-box;"></div>
        <div style="font-size: 14px; color: oklch(0.94 0.006 250); flex-grow: 1;">Inferred</div>
        <div class="cnt">512</div>
      </div>
      <div class="opt">
        <div class="chk off"></div>
        <div style="width: 9px; height: 9px; border-radius: 50%; background: linear-gradient(90deg, oklch(0.78 0.13 75) 50%, transparent 50%); border: 1.5px solid oklch(0.78 0.13 75); box-sizing: border-box;"></div>
        <div style="font-size: 14px; color: oklch(0.86 0.006 250); flex-grow: 1;">Ambiguous</div>
        <div class="cnt">41</div>
      </div>
      <div class="opt" style="border-bottom: 1px solid oklch(0.21 0.010 250);">
        <div class="chk off"></div>
        <div style="width: 5px; height: 5px; border-radius: 50%; background: oklch(0.45 0.008 250); margin: 0 2px;"></div>
        <div style="font-size: 14px; color: oklch(0.86 0.006 250); flex-grow: 1;">Unknown</div>
        <div class="cnt">228</div>
      </div>
    </div>

    <div class="lbl" style="padding-top: 14px;">Include</div>
    <div style="display: flex; flex-direction: column; padding-top: 6px;">
      <div class="opt">
        <div class="chk off"></div>
        <div style="font-size: 14px; color: oklch(0.86 0.006 250); flex-grow: 1;">Rejected segments</div>
        <div class="cnt">39</div>
      </div>
      <div class="opt" style="border-bottom: 1px solid oklch(0.21 0.010 250);">
        <div class="chk on"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="oklch(0.16 0.01 150)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg></div>
        <div style="font-size: 14px; color: oklch(0.94 0.006 250); flex-grow: 1;">Corrected by you</div>
        <div class="cnt">22</div>
      </div>
    </div>

  </div>

  <div style="padding: 12px 20px 24px;">
    <div style="display: flex; align-items: center; justify-content: center; height: 48px; background: oklch(0.72 0.14 150); border-radius: 8px;"><div style="font-size: 15px; font-weight: 500; color: oklch(0.16 0.01 150);">Show 2,416 overs</div></div>
  </div>

</div>
</x-dc>
</body>
</html>
