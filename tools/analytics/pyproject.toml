[project]
name = "ort-analytics-tools"
version = "0.1.0"
description = "Reference ingest server and analysis tooling for the offline-radio-transcriber analytics channel (D42, D48, FR-ANL-1..14)."
requires-python = ">=3.10"
dependencies = ["duckdb>=1.0"]

[project.optional-dependencies]
test = ["pytest>=8", "ruff==0.16.6"]

[project.scripts]
ort-analytics = "cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["."]
