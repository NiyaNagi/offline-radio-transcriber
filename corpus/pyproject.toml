[project]
name = "ort-corpus"
version = "0.1.0"
description = "Corpus pipeline for the offline-radio-transcriber: acquisition, fold gate, evaluation harness v0 (functional-spec §14A.2/§14A.3, implementation-plan M0)."
requires-python = ">=3.10"
# numpy is used unconditionally (not lazily, unlike the r1-real extra below) by
# synth/channel.py, synth/generator.py, synth/tts.py and probes/speaker_separation.py — it
# belongs in base dependencies, not an optional extra. This was missing until CI on a clean
# runner caught it (ModuleNotFoundError at test collection): it worked in every local session
# only because numpy happened to already be installed as a transitive dependency of the r1-real
# extra's own toolchain (torch etc.), which masked the gap until a machine without that
# extra installed tried to run the base test suite.
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.16.6"]
# R1 (spec/build-plan.md S1.7): the real LoRA fine-tune / merge / sherpa-onnx export / load /
# transcribe toolchain. Not needed to run the fake-backed test suite — only RealLoraTrainer,
# RealSherpaOnnxExporter and RealSherpaOnnxRuntime in corpus.probes.lora_export import these,
# and they do so lazily. Versions pinned to what was verified mutually compatible on
# Windows/py3.13, CPU-only torch, in the session that produced results/r1-lora-export.md.
r1-real = [
    "torch==2.11.0",
    "transformers==5.16.1",
    "peft==0.20.0",
    "accelerate==1.14.0",
    "sherpa-onnx==1.13.7",
    "openai-whisper==20250625",
    "onnx==1.22.0",
    "onnxruntime==1.29.0",
    "onnxscript==0.7.1",
    "datasets==5.0.1",
    "soundfile==0.13.1",
    "huggingface_hub==1.30.0",
]

[project.scripts]
corpus = "corpus.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
